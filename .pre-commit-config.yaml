# Проверки перед каждым коммитом. Установка (один раз): uv run pre-commit install
# Запуск вручную по всем файлам: uv run pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: uv run ruff check src tests
        language: system
        types: [python]
        pass_filenames: false

      # весь набор тестов (~10–15 c): domain, application, infrastructure и
      # UI-сценарии на встроенном PostgreSQL (pgserver) — без docker и сети
      - id: pytest
        name: pytest (all tests)
        entry: uv run pytest -q -x -p no:cacheprovider
        language: system
        pass_filenames: false
        always_run: true
