# логи docker (docker logs) не растут бесконечно: 3 файла по 20 МБ
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:16
    container_name: trainup_db
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__POSTGRES__USER}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__POSTGRES__PASSWORD}
      POSTGRES_DB: ${APP_CONFIG__DB__POSTGRES__NAME}
    env_file:
      - .env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --appendonly yes --save "900 1 300 10 60 100"
    container_name: trainup_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    image: ghcr.io/koresh06/trainup:latest
    container_name: trainup_bot
    # файлы логов приложения (bot.log, worker.log, …, errors.log) — на хосте в ./logs
    volumes:
      - ./logs:/app/logs
    logging: *default-logging
    command: python -m src.presentation.telegram.app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  worker:
    image: ghcr.io/koresh06/trainup:latest
    container_name: trainup_worker
    # файлы логов приложения (bot.log, worker.log, …, errors.log) — на хосте в ./logs
    volumes:
      - ./logs:/app/logs
    logging: *default-logging
    command: taskiq worker src.worker:broker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  scheduler:
    image: ghcr.io/koresh06/trainup:latest
    container_name: trainup_scheduler
    # файлы логов приложения (bot.log, worker.log, …, errors.log) — на хосте в ./logs
    volumes:
      - ./logs:/app/logs
    logging: *default-logging
    command: taskiq scheduler src.scheduler:scheduler
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # webhook ЮKassa + страница возврата после оплаты; наружу — через HTTPS-прокси
  # (nginx/caddy) на домен из APP_CONFIG__PAYMENT__YOOKASSA__RETURN_URL
  webhook:
    image: ghcr.io/koresh06/trainup:latest
    container_name: trainup_webhook
    # файлы логов приложения (bot.log, worker.log, …, errors.log) — на хосте в ./logs
    volumes:
      - ./logs:/app/logs
    logging: *default-logging
    command: uvicorn src.presentation.web.app:create_app --host 0.0.0.0 --port 8080 --factory
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  # HTTPS-прокси на webhook: сертификат Let's Encrypt выпускается автоматически
  caddy:
    image: caddy:2
    container_name: trainup_caddy
    environment:
      WEBHOOK_DOMAIN: ${WEBHOOK_DOMAIN:-bot.24timekeep.ru}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - webhook
    restart: always

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config: