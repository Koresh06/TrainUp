services:
  db:
    image: postgres:16
    container_name: trainup_db
    environment:
      POSTGRES_USER: ${APP_CONFIG__DB__POSTGRES__USER}
      POSTGRES_PASSWORD: ${APP_CONFIG__DB__POSTGRES__PASSWORD}
      POSTGRES_DB: ${APP_CONFIG__DB__POSTGRES__NAME}
    env_file:
      - .env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --appendonly yes --save "900 1 300 10 60 100"
    container_name: trainup_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainup_migrate
    command: alembic -c alembic.ini upgrade head
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainup_bot
    command: python -m src.presentation.telegram.app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainup_worker
    command: taskiq worker src.worker:broker
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainup_scheduler
    command: taskiq scheduler src.scheduler:scheduler
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres_data:
  redis_data: