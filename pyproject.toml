[project]
name = "trainup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiogram-dialog>=2.6.0",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "betterlogging>=1.0.0",
    "dishka>=1.10.1",
    "orjson>=3.11.9",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "taskiq-redis>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
