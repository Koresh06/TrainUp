[project]
name = "trainup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.30.0",
    "aiogram-dialog>=2.6.0",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "betterlogging>=1.0.0",
    "dishka>=1.10.1",
    "fastapi>=0.138.0",
    "matplotlib>=3.11.2",
    "orjson>=3.11.9",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "taskiq-redis>=1.2.3",
    "uvicorn>=0.49.0",
    "yookassa>=3.10.1",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.39.0",
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff.lint]
ignore = [
    "E501",  # line too long (длинные Format-строки в диалогах)
]

[tool.ruff.lint.per-file-ignores]
"src/infrastructure/database/migration/versions/*" = ["F401"]
"tests/conftest.py" = ["E402"]

[tool.coverage.run]
# SQLAlchemy asyncio переключает контекст через greenlet
concurrency = ["greenlet", "thread"]
source = ["src"]
omit = ["src/infrastructure/database/migration/*"]
