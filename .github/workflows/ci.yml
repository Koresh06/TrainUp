name: CI

# Линтер и тесты на каждый push и PR. Тот же workflow вызывается из
# build-and-deploy.yml: образ не собирается, пока тесты не прошли.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff
        run: uv run ruff check src tests

      # PostgreSQL поднимается встроенным pgserver, Redis — fakeredis,
      # Telegram и taskiq подменены фейками: секреты и сервисы не нужны
      - name: Pytest
        run: uv run pytest -q -p no:cacheprovider --cov --cov-report=term:skip-covered
